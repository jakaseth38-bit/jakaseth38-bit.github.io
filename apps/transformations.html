<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGCSE Transformations Lab</title><style>body{margin:0;font:16px Arial;background:#07111f;color:#eef7ff}main{max-width:1000px;margin:auto;padding:24px}.card{background:#0d1b2a;border:1px solid #24445f;border-radius:16px;padding:18px;margin:14px 0}label{display:block;margin:10px 0}input{width:240px}canvas{width:100%;height:450px;background:#06101a;border:1px solid #24445f;border-radius:12px}button{padding:10px;background:#10263b;color:white;border:1px solid #24445f;border-radius:9px}</style></head><body><main><div class="card"><h1>📐 IGCSE Transformations Lab</h1><p>Explore translation, reflection, rotation and enlargement.</p><label>Transformation <select id="type" onchange="draw()"><option>Translation</option><option>Reflection in x-axis</option><option>Reflection in y-axis</option><option>Rotation 90° anticlockwise</option><option>Enlargement</option></select></label><label>Value <input id="v" type="range" min="-4" max="4" step="1" value="2" oninput="draw()"></label><canvas id="c" width="900" height="450"></canvas><p id="read"></p></div></main><script>function draw(){let C=c,x=C.getContext('2d'),W=C.width,H=C.height;x.clearRect(0,0,W,H);x.strokeStyle='#24445f';for(let i=0;i<=18;i++){x.beginPath();x.moveTo(i*50,0);x.lineTo(i*50,H);x.stroke()}for(let i=0;i<=9;i++){x.beginPath();x.moveTo(0,i*50);x.lineTo(W,i*50);x.stroke()}let pts=[[2,1],[5,1],[3,4]],t=type.value,n=+v.value;function T(p){let X=p[0],Y=p[1];if(t==='Translation')return[X+n,Y+n];if(t==='Reflection in x-axis')return[X,-Y];if(t==='Reflection in y-axis')return[-X,Y];if(t.startsWith('Rotation'))return[-Y,X];return[X*n,Y*n]}function P(p){return[450+p[0]*50,225-p[1]*50]}function poly(a,stroke){x.beginPath();a.forEach((p,i)=>{let q=P(p);i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])});x.closePath();x.strokeStyle=stroke;x.lineWidth=4;x.stroke()}poly(pts);poly(pts.map(T));read.textContent=t==='Enlargement'?`Scale factor = ${n}`:t==='Translation'?`Translation by (${n}, ${n})`:`Transformation: ${t}`}draw()</script></body></html>
