<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGCSE Command Centre</title><style>body{font:16px Arial;margin:0;background:#07111f;color:#eef7ff}main{max-width:1100px;margin:auto;padding:24px}.card{background:#0d1b2a;border:1px solid #24445f;border-radius:16px;padding:18px;margin:14px 0}button{padding:9px 12px;border-radius:9px;border:1px solid #24445f;background:#10263b;color:white;cursor:pointer}input{padding:9px;width:80%;background:#081722;color:white;border:1px solid #24445f}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.topic{padding:9px;margin:5px 0;background:#081722;border-radius:8px;cursor:pointer}.bar{height:9px;background:#06101a;border-radius:9px}.bar i{display:block;height:100%;background:#38bdf8}.muted{color:#9db3c9}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="card"><h1>🎯 IGCSE Command Centre</h1><p class="muted">Your all-subject revision control room.</p><input id="s" placeholder="Search subjects or topics" oninput="render()"></div><div id="grid" class="grid"></div><div id="lesson" class="card"><h2>Select a topic</h2><p>Click a topic to get an exam-focused task.</p></div></main><script>const data=[['English Language','1123',['Reading','Summary','Writer’s effect','Directed writing']],['Mathematics','0580',['Algebra','Functions','Probability','Statistics','Transformations','Trigonometry']],['Biology','0610',['Cells','Enzymes','Transport','Diseases','Respiration','Inheritance','Ecology']],['Chemistry','0620',['Atoms','Stoichiometry','Acids','Electrolysis','Metals','Organic chemistry']],['Physics','0625',['Motion','Forces','Energy','Waves','Electricity','Magnetism','Nuclear physics','Space physics']],['Business Studies','0450',['Business activity','Marketing','Operations','Finance','External influences']],['Geography','0460',['Population','Rivers','Coasts','Weather','Hazards','Economic development']],['History','0470',['Germany 1918–1945','Treaty of Versailles','Cold War','Source analysis']],['Accounting','0452',['Double entry','Trial balance','Financial statements','Ratios']],['ICT','0417',['Networks','Security','Databases','Spreadsheets','Web authoring']],['Economics','0455',['Basic economic problem','Demand and supply','Macroeconomy','International trade']],['Art & Design','0400',['Research','Experimentation','Composition','Personal response']],['Music','0410',['Listening','Aural skills','Composition','Performance']]];let done=JSON.parse(localStorage.done||'{}');function render(){let q=s.value.toLowerCase();grid.innerHTML=data.map((x,i)=>{let ts=x[2].filter(t=>(x[0]+t).toLowerCase().includes(q));if(!ts.length)return'';let p=Math.round(ts.filter(t=>done[x[1]+t]).length/ts.length*100);return `<div class="card"><b>${x[1]}</b><h2>${x[0]}</h2><div class="bar"><i style="width:${p}%"></i></div>${ts.map(t=>`<div class="topic" onclick="pick(${i},'${t.replace(/'/g,"\\'")}')">${t}</div>`).join('')}</div>`}).join('')}function pick(i,t){lesson.innerHTML=`<h2>${data[i][0]}: ${t}</h2><p><b>Exam method:</b> define key terms, explain the mechanism, apply knowledge to unfamiliar information and use the command word precisely.</p><p><b>60-second recall:</b> explain the topic without notes.</p><button onclick="master('${data[i][1]}','${t.replace(/'/g,"\\'")}')">Mark mastered</button>`}function master(c,t){done[c+t]=1;localStorage.done=JSON.stringify(done);render()}render();</script></body></html>
