<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGCSE Probability Lab</title><style>body{margin:0;font:16px Arial;background:#07111f;color:#eef7ff}main{max-width:1000px;margin:auto;padding:24px}.card{background:#0d1b2a;border:1px solid #24445f;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}button,input{font:inherit;padding:10px;border-radius:9px}button{background:#10263b;color:white;border:1px solid #24445f;cursor:pointer}input{width:80%;background:#081722;color:white;border:1px solid #24445f}.bar{height:28px;background:#06101a;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#38bdf8}.big{font-size:2rem;font-weight:bold}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="card"><h1>🎲 IGCSE Probability Lab</h1><p>Experiment with theoretical and experimental probability.</p></div><div class="grid"><div class="card"><h2>Coin simulation</h2><label>Trials <input id="n" type="range" min="10" max="1000" value="100" oninput="sim()"></label><p id="out"></p><div class="bar"><i id="bar"></i></div><button onclick="sim()">Run experiment</button></div><div class="card"><h2>Core formulas</h2><p>Probability = favourable outcomes ÷ total outcomes.</p><p>P(not A) = 1 − P(A)</p><p>P(A or B) = P(A)+P(B)−P(A and B)</p><p>For independent events: P(A and B)=P(A)P(B)</p></div></div><div class="card"><h2>Exam challenge</h2><button onclick="challenge()">New question</button><p id="q"></p></div></main><script>function sim(){let N=+n.value,h=0;for(let i=0;i<N;i++)h+=Math.random()<.5;let p=h/N;out.textContent=`Heads: ${h}/${N} = ${p.toFixed(3)}`;bar.style.width=p*100+'%'}const qs=['A fair die is rolled. Find P(rolling a number greater than 4).','A bag has 3 red and 5 blue counters. Find P(red).','Two fair coins are tossed. Find P(two heads).','A card is chosen from 1–10. Find P(a prime number).'];function challenge(){q.textContent=qs[Math.floor(Math.random()*qs.length)]}sim();challenge()</script></body></html>
