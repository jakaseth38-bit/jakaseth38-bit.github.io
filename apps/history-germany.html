<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGCSE History: Germany 1918–1945</title><style>body{margin:0;font:16px Arial;background:#10131a;color:#f5f7fa}main{max-width:1000px;margin:auto;padding:24px}.card{background:#191f29;border:1px solid #394657;border-radius:15px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.year{font-size:1.3rem;color:#7dd3fc;font-weight:bold}.muted{color:#aeb9c6}button{padding:10px;border:1px solid #394657;border-radius:9px;background:#243142;color:white}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="card"><h1>🇩🇪 Germany 1918–1945</h1><p class="muted">IGCSE History revision lab. Timeline, causation and exam practice.</p></div><div id="timeline" class="grid"></div><div class="card"><h2>Exam practice</h2><button onclick="q()">Generate question</button><p id="q"></p></div></main><script>const t=[['1918','Kaiser abdicates; German Revolution begins.'],['1919','Weimar Republic established; Treaty of Versailles signed.'],['1923','Hyperinflation and Ruhr crisis. Munich Putsch.'],['1924','Dawes Plan supports economic recovery.'],['1929','Wall Street Crash damages German economy.'],['1933','Hitler becomes Chancellor; dictatorship established.'],['1934','Night of the Long Knives; Hitler becomes Führer.'],['1935','Nuremberg Laws; rearmament openly expands.'],['1938','Anschluss; Munich Agreement; Kristallnacht.'],['1939','Germany invades Poland; Second World War begins.'],['1941','Germany invades the Soviet Union.'],['1942–43','Stalingrad marks a major turning point.'],['1945','Hitler dies; Germany surrenders.']];timeline.innerHTML=t.map(x=>`<div class="card"><div class="year">${x[0]}</div><p>${x[1]}</p></div>`).join('');const qs=['Explain why the Weimar Republic faced serious problems in 1919–23.','Why was Hitler able to become Chancellor in 1933?','How did Nazi control over Germany increase after 1933?','How far did Nazi economic policies improve Germany?','Why did opposition to the Nazis remain limited?','Explain the importance of the Treaty of Versailles to German politics.'];function q(){document.getElementById('q').textContent=qs[Math.floor(Math.random()*qs.length)]}</script></body></html>
