<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGCSE Physics Lab</title><style>body{margin:0;font:16px Arial;background:#07111f;color:#eef7ff}main{max-width:1050px;margin:auto;padding:24px}.card{background:#0d1b2a;border:1px solid #24445f;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}input{width:220px}canvas{width:100%;height:300px;background:#06101a;border:1px solid #24445f;border-radius:12px}.big{font-size:2rem;font-weight:bold}button{padding:10px;background:#10263b;color:white;border:1px solid #24445f;border-radius:9px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="card"><h1>⚡ IGCSE Physics Lab</h1><p>Interactive models for motion, electricity and waves.</p></div><div class="grid"><div class="card"><h2>V = IR</h2><label>Voltage V <input id="V" type="range" min="0" max="24" value="12" oninput="calc()"></label><label>Resistance Ω <input id="R" type="range" min="1" max="20" value="6" oninput="calc()"></label><div id="I" class="big"></div><p>Current I = V ÷ R</p></div><div class="card"><h2>Wave speed</h2><label>Frequency Hz <input id="f" type="range" min="1" max="20" value="5" oninput="wave()"></label><label>Wavelength m <input id="l" type="range" min="1" max="10" value="4" oninput="wave()"></label><div id="w" class="big"></div><p>v = fλ</p></div></div><div class="card"><h2>Projectile model</h2><label>Speed <input id="s" type="range" min="5" max="40" value="20" oninput="proj()"></label><label>Angle <input id="a" type="range" min="10" max="80" value="45" oninput="proj()"></label><canvas id="c" width="900" height="300"></canvas></div></main><script>function calc(){I.textContent=`I = ${(V.value/R.value).toFixed(2)} A`}function wave(){w.textContent=`v = ${f.value*l.value} m/s`}function proj(){let x=c.getContext('2d');x.clearRect(0,0,900,300);let v=+s.value,a=+document.getElementById('a').value*Math.PI/180,g=9.8;x.beginPath();for(let t=0;t<3;t+=.04){let X=40+v*Math.cos(a)*t*20,Y=270-(v*Math.sin(a)*t-.5*g*t*t)*10;if(X>880||Y>290)break;t?x.lineTo(X,Y):x.moveTo(X,Y)}x.strokeStyle='#38bdf8';x.lineWidth=4;x.stroke()}calc();wave();proj()</script></body></html>
